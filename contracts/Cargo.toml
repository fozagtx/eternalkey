[package]
name = "eternal-key-vault"
description = "Bitcoin inheritance vault using Charms protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
charms-sdk = { path = "../bitcoin-vault/charms-integration/charms-protocol/charms-sdk", version = "0.10.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10.8" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true

# Empty `[workspace]` section to make this a "top-level" project
[workspace]
