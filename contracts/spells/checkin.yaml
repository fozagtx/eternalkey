version: 8

apps:
  $00: n/${app_id}/${app_vk}

private_inputs:
  $00: "Checkin"

ins:
  - utxo_id: ${vault_utxo}
    charms:
      $00:
        owner: ${owner_address}
        beneficiaries: ${beneficiaries}
        timeout_blocks: ${timeout_blocks}
        last_checkin: ${old_checkin}
