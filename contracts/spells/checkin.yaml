    charms:
      $00:
        owner: ${owner_address}
        beneficiaries: ${beneficiaries}
        timeout_blocks: ${timeout_blocks}
        last_checkin: ${current_block}
        vault_balance: ${vault_balance}
        status: Active
        vault_id: ${vault_id}
        created_at: ${created_at}